name: lama-inpaint
on:
  push:
    branches: [claude/lama-inpaint-tmp]
    paths: [.github/workflows/lama.yml]
permissions:
  contents: write
jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixa e fatia o modelo LaMa
        run: |
          curl -sSL -o big-lama.pt https://github.com/enesmsahin/simple-lama-inpainting/releases/download/v0.1.0/big-lama.pt
          ls -la big-lama.pt
          split -b 90m big-lama.pt lama/model-chunk-
      - name: Publica fatias no branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add lama/model-chunk-*
          git commit -m "Fatias do modelo LaMa [skip ci]"
          git push
